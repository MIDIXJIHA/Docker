version: "3.9"

services:

  app:
    build:
      context: ./docker/php
    container_name: myapp-php-oracle
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: myapp-nginx-oracle
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: container-registry.oracle.com/database/free:latest
    container_name: myapp-oracle
    restart: unless-stopped
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      ORACLE_CHARACTERSET: ${ORACLE_CHARACTERSET}
    ports:
      - "1521:1521"
    volumes:
      - dbdata:/opt/oracle/oradata
    shm_size: 1gb

volumes:
  dbdata:
